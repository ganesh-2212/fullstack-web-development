<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <article id="contact">
        <h2>Contact Me</h2>
        <p>I'd really like to hear from you!</p>
        <form action="https://httpbin.org/get" method="get">
            <fieldset>
                <legend>Personal Info</legend>
                <p>
                    <label for="firstName">First Name:</label>
                    <input type="text" name="firstName" id="firstName" placeholder="Ganesh" autocomplete="on" autofocus
                        required>
                </p>
                <p>
                    <label for="lastName">Last Name:</label>
                    <input type="text" name="lastName" id="lastName" placeholder="Anand" autocomplete="on" required>
                </p>
                <p>
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required placeholder="Enter your password">
                </p>
                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" name="phone" id="phone" required placeholder="5555555555"
                        pattern="[0-9]{3}[0-9]{3}[0-9]{4}">
                </p>
                <p>
                    <label for="decade">Decade:</label>
                    <input type="number" name="decade" id="decade" required placeholder="Enter decade" max="2050"
                        min="1980" step="10" value="1980">
                </p>
                <p>
                    <label for="coffee">Favorite coffee:</label>
                    <select name="coffee" id="coffee">
                        <optgroup label="American">
                            <option value="Espresso">Espresso</option>
                            <option value="Cappuccino">Cappuccino</option>
                        </optgroup>
                        <optgroup label="Indian Coffee">
                            <option value="Black Coffee" selected>Black Coffee</option>
                            <option value="Iced Coffee">Iced Coffee</option>
                        </optgroup>
                    </select>
                </p>
                <p>
                    <label for="coffee">Favorite coffee:</label>
                    <input type="text" name="coffee" id="coffee" list="coffee-list">
                    <datalist id="coffee-list">
                        <option value="Espresso">Espresso</option>
                        <option value="Cappuccino">Cappuccino</option>
                        <option value="Black Coffee" selected>Black Coffee</option>
                        <option value="Iced Coffee">Iced Coffee</option>
                    </datalist>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Favorite Food</legend>
                <p>
                    <input type="radio" name="food" id="dhosa" value="dhosa">
                    <label for="dhosa">Dhosa</label>
                </p>
                <p>
                    <input type="radio" name="food" id="idly" value="idly">
                    <label for="idly">Idly</label>
                </p>
                <p>
                    <input type="radio" name="food" id="noodles" value="noodles">
                    <label for="noodles">Noodles</label>
                </p>
                <p>
                    <input type="radio" name="food" id="pasta" value="pasta">
                    <label for="pasta">Pasta</label>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Pets</legend>
                <p>Do you have Pets?</p>
                <p>
                    <input type="checkbox" name="dog" id="dog" value="dog">
                    <label for="pets">Dog</label>
                </p>
                <p>
                    <input type="checkbox" name="cat" id="cat" value="cat">
                    <label for="pets">Cat</label>
                </p>
                <p>
                    <input type="checkbox" name="fish" id="fish" value="fish">
                    <label for="pets">Fish</label>
                </p>
                <br>
                <fieldset>
                    <legend>Send Message</legend>
                    <br>
                    <label for="message">Your Message...</label>
                    <br>
                    <textarea name="message" id="message" cols="50" rows="10">Type here...</textarea>
                </fieldset>
                <br>
                <button type="submit">Submit</button>&nbsp;&nbsp;
                <button type="reset">Reset</button>
            </fieldset>
        </form>
    </article>

</body>

</html>
