<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="2">Topic</th>
            </tr>
            <tr>
                <th>Start</th>
                <th>End</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row" rowspan="2">Monday</th>
                <td rowspan="2">08:00 AM</td>
                <td rowspan="2">05:00 PM</td>
                <td>Introduction</td>
            </tr>

            <tr>
                <td>Uses</td>
            </tr>

            <tr>
                <th scope="row" rowspan="4">Tuesday</th>
                <td>
                    <time datetime="08:00">08.00 AM</time>
                </td>
                <td>
                    <time datetime="11:00">11.00 PM</time>
                </td>
                <td> - </td>
            </tr>

            <tr>
                <td>
                    <time datetime="11:00">11.00 AM</time>
                </td>
                <td>
                    <time datetime="02:00">02.00 PM</time>
                </td>
                <td>Learn</td>
            </tr>

            <tr>
                <td>
                    <time datetime="02:00">02.00 PM</time>
                </td>
                <td>
                    <time datetime="08:00">08.00 PM</time>
                </td>
                <td rowspan="2"> - </td>
            </tr>

            <tr>
                <td>
                    <time datetime="10:00">10.00 AM</time>
                </td>
                <td>
                    <time datetime="01:00">01.00 PM</time>
                </td>
            </tr>

            <tr>
                <th scope="row">Wed-Fri</th>
                <td colspan="2">Full Day</td>
                <td>Practical</td>
            </tr>

            <tr>
                <th scope="row">Sat-Sun</th>
                <td colspan="2">
                    <time datetime="11:00">11:00 AM</time> - <time datetime="05:00">05:00 PM</time>
                </td>
                <td>Extra Class</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">End of Table</td>
            </tr>

        </tfoot>
    </table>
</body>

</html>
