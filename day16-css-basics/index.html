<!DOCTYPE html>
<html lang="en">

<head>

    <title>Position Property</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="outerbox">
        <div class="innerbox">

            <div class="box abs">
                <p>Absolute</p>
            </div>

                <p>Sticky</p>

            </div>
        </div>
    </div>
