<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <ul>
            <li>Home</li>
            <li>Products</li>
            <li>About Us</li>
            <li>Contact</li>
        </ul>
    </nav>

    <main>

        <p>This is First Paragraph</p>
        <p>This is <span class="a1">Second</span> Paragraph</p>

    </main>

    <article>
        <h1 class="b1">This is First Paragraph</h1>
        <h1 class="b2">This is First Paragraph</h1>
        <h1 class="b3">This is First Paragraph</h1>
    </article>





</body>

</html>
