<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatiable" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile cards</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1>Staffs</h1>
        <nav>
            <a href="#profile1">Joe Coder</a>
            <a href="#profile2">Harry</a>
            <a href="#profile3">Ganry</a>
        </nav>
    </header>


    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="asstes/profile1-500x500.png" alt="profile1" width="500" height="500">
                <figcaption><span class="nowrap">Joe Coder</span></figcaption>
            </figure>
            <p><q>I code stuffs</q></p>
        </article>

        <article id="profile2" class="card">
            <figure>
                <img src="asstes/profile2-500x500.png" alt="profile2" width="500" height="500">
                <figcaption><span class="nowrap">Harry</span></figcaption>
            </figure>
            <p><q>I code stuffs</q></p>
        </article>

        <article id="profile3" class="card">
            <figure>
                <img src="asstes/profile3-500x500.png" alt="profile3" width="500" height="500">
                <figcaption><span class="nowrap">Ganry</span></figcaption>
            </figure>
            <p><q>I code stuffs</q></p>
        </article>

    </main>

    <footer>
        <p>&copy andco.com</p>
    </footer>

</body>

</html>
